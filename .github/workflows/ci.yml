# Checks every pull request and every push to main: lint, types, build, tests, and repo hygiene.
# Read-only: no AWS access, no secrets except the private banned-names list. Terraform only
# gets fmt/validate here; plan and apply stay with the owner.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR or branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, build, Terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The build writes Next's route types, which the type check reads.
      - run: npm run build
      - run: npm run typecheck
      # infra/lambda.tf hashes the worker zip, so validate needs it built.
      - run: npm run build:worker
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: terraform fmt and validate (no backend, no credentials)
        working-directory: infra
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # Postgres listens on 55440, where the tests expect it (tests/helpers/env.ts).
  unit:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: draftpage_test
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  # Split into shard jobs, each with its own runner, Postgres and dev server, so the slowest
  # job sets the wall time. Playwright deals the tests out evenly by count (fullyParallel), so
  # new tests need no assignment. More shards finish sooner but each pays ~35 s of setup and
  # rounds up to whole billed minutes: 3 roughly halves the wall time for ~1.4x the minutes.
  e2e:
    name: Browser tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false # a failure in one shard still shows the other shards' results
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: draftpage_test
        ports: ["55440:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The runner image ships Google Chrome, which playwright.config.ts uses (channel: "chrome").
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 3

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history for the migration diff and the secret scan
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Dependencies are pinned exactly
        run: node scripts/ci/check-exact-versions.ts
      - name: Applied migrations are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "No base commit to compare with; skipped."
          else
            node scripts/ci/check-migrations.ts "$BASE"
          fi
      - name: No banned names
        env:
          BANNED_NAMES_PATTERN: ${{ secrets.BANNED_NAMES_PATTERN }}
        run: scripts/check-banned-names.sh --all
      - name: No secrets in Git history (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
